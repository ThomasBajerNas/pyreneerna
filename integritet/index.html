<script>
var T = {"sv": {"name": "Svenska", "back": "← Tillbaka till guiden", "updated": "Senast uppdaterad 18 oktober 2026", "title": "Integritetspolicy", "intro": "Så här hanterar pyreneestrip.com personuppgifter. Guiden går att använda utan konto och utan att lämna några personuppgifter, och vi använder inga cookies för reklam eller spårning.", "s": [["Vem ansvarar", ["Personuppgiftsansvarig är Thomas Bajer (enskild firma), Sverige. Kontakt: <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>."]], ["Det som sparas i din webbläsare", ["Min resa, anteckningar, egna cykelturer, språkval, filter och dina köp sparas i webbläsarens lokala lagring på din egen enhet. Det skickas inte till oss. Är du superanvändare sparas också din personliga inloggningsnyckel där.", "Installerar du guiden som app sparas sidor och kartbilder du har tittat på, så att guiden fungerar utan nät. Du raderar allt genom att rensa webbplatsdata för pyreneestrip.com i webbläsaren."]], ["Besöksstatistik och drift", ["Vi räknar besök med Cloudflare Web Analytics: antal besök, vilka sidor som läses, land och typ av enhet. Det sker utan cookies och utan att du kan identifieras.", "Webbplatsen drivs av Cloudflare, som behandlar din IP-adress tekniskt för att leverera sidan och skydda mot attacker. Statistiken från Google Search Console visar vilka sökord som leder till guiden och innehåller inga uppgifter om enskilda besökare."]], ["Köp och betalning", ["När du köper en guide eller GPX-fil eller blir superanvändare sköts betalningen av Stripe. Vi får din e-postadress, ditt namn, land, vad du köpt och beloppet – aldrig dina kortuppgifter.", "Uppgifterna används för att leverera köpet, skicka kvitto, hantera abonnemanget, återbetalningar och support. Den rättsliga grunden är avtalet med dig. Underlaget sparas i sju år eftersom bokföringslagen kräver det."]], ["Superanvändare och e-post", ["Som superanvändare kopplas abonnemanget till ditt kundnummer hos Stripe. Inloggningslänkar skickas till din e-postadress via e-posttjänsten Resend. Vi skickar ingen marknadsföring."]], ["Om du kontaktar oss", ["Skriver du till info@pyreneestrip.com använder vi din adress och ditt meddelande för att svara, och sparar dem så länge ärendet kräver."]], ["Innehåll från andra tjänster", ["För att guiden ska fungera hämtar din webbläsare innehåll direkt från andra tjänster, som då ser din IP-adress: kartor från OpenStreetMap, CyclOSM, OpenTopoMap, Waymarked Trails, OpenSnowMap och Esri (och Google Maps om du väljer den kartan), typsnitt från Google Fonts, programkod från cdnjs och bilder från Wikimedia Commons.", "Ritar du en egen cykeltur eller söker efter en ort skickas punkterna eller söktexten till BRouter (brouter.de) och OpenStreetMaps sökning Nominatim."]], ["Partnerlänkar", ["En del bokningslänkar är annonslänkar, märkta med \"Annonslänk\", via Travelpayouts, CJ (Booking.com) och andra partnerprogram. Ett skript från Travelpayouts hämtas till sidan för att göra om länkarna, och deras server ser då din IP-adress.", "Klickar du på en sådan länk kan partnern sätta en cookie på sin egen webbplats för att se att du kom från guiden. Det styrs av partnerns integritetspolicy. Vi får bara uppgift om provision, inte vem du är."]], ["Överföring utanför EU", ["Stripe, Cloudflare, Google och Resend kan behandla uppgifter i USA. Överföringen sker enligt EU:s och USA:s ramverk för dataskydd (Data Privacy Framework) eller EU-kommissionens standardavtalsklausuler."]], ["Dina rättigheter", ["Du har rätt att få veta vilka uppgifter vi har om dig, få dem rättade eller raderade (utom det som bokföringslagen kräver att vi sparar), invända mot behandlingen och få ut dina uppgifter. Skriv till <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>.", "Är du missnöjd kan du klaga hos Integritetsskyddsmyndigheten, <a href=\"https://www.imy.se/\" rel=\"noopener\">IMY (imy.se)</a>, eller dataskyddsmyndigheten i ditt land."]], ["Ändringar", ["Vi uppdaterar policyn när guiden ändras. Datumet nedan visar den senaste ändringen. Köpvillkoren finns på <a href=\"/villkor/\">pyreneestrip.com/villkor</a>."]]]}, "no": {"name": "Norsk", "back": "← Tilbake til guiden", "updated": "Sist oppdatert 18. oktober 2026", "title": "Personvernerklæring", "intro": "Slik behandler pyreneestrip.com personopplysninger. Guiden kan brukes uten konto og uten å oppgi personopplysninger, og vi bruker ingen informasjonskapsler til reklame eller sporing.", "s": [["Hvem er ansvarlig", ["Behandlingsansvarlig er Thomas Bajer (enkeltpersonforetak), Sverige. Kontakt: <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>."]], ["Det som lagres i nettleseren din", ["Min reise, notater, egne sykkelturer, språkvalg, filtre og kjøpene dine lagres i nettleserens lokale lagring på din egen enhet. Det sendes ikke til oss. Er du superbruker, lagres også din personlige innloggingsnøkkel der.", "Installerer du guiden som app, lagres sider og kartbilder du har sett på, slik at guiden fungerer uten nett. Du sletter alt ved å fjerne nettstedsdata for pyreneestrip.com i nettleseren."]], ["Besøksstatistikk og drift", ["Vi teller besøk med Cloudflare Web Analytics: antall besøk, hvilke sider som leses, land og type enhet. Det skjer uten informasjonskapsler og uten at du kan identifiseres.", "Nettstedet driftes av Cloudflare, som behandler IP-adressen din teknisk for å levere siden og beskytte mot angrep. Statistikken fra Google Search Console viser hvilke søkeord som leder til guiden og inneholder ingen opplysninger om enkeltbesøkende."]], ["Kjøp og betaling", ["Når du kjøper en guide eller GPX-fil eller blir superbruker, håndteres betalingen av Stripe. Vi får e-postadressen din, navnet ditt, land, hva du har kjøpt og beløpet – aldri kortopplysningene dine.", "Opplysningene brukes til å levere kjøpet, sende kvittering, håndtere abonnementet, tilbakebetalinger og support. Det rettslige grunnlaget er avtalen med deg. Underlaget lagres i sju år fordi svensk bokføringslov krever det."]], ["Superbruker og e-post", ["Som superbruker knyttes abonnementet til kundenummeret ditt hos Stripe. Innloggingslenker sendes til e-postadressen din via e-posttjenesten Resend. Vi sender ingen markedsføring."]], ["Hvis du kontakter oss", ["Skriver du til info@pyreneestrip.com, bruker vi adressen og meldingen din til å svare, og lagrer dem så lenge saken krever."]], ["Innhold fra andre tjenester", ["For at guiden skal fungere, henter nettleseren din innhold direkte fra andre tjenester, som da ser IP-adressen din: kart fra OpenStreetMap, CyclOSM, OpenTopoMap, Waymarked Trails, OpenSnowMap og Esri (og Google Maps hvis du velger det kartet), skrifttyper fra Google Fonts, programkode fra cdnjs og bilder fra Wikimedia Commons.", "Tegner du en egen sykkeltur eller søker etter et sted, sendes punktene eller søketeksten til BRouter (brouter.de) og OpenStreetMaps søk Nominatim."]], ["Partnerlenker", ["Noen bestillingslenker er annonselenker, merket med \"Annonselenke\", via Travelpayouts, CJ (Booking.com) og andre partnerprogrammer. Et skript fra Travelpayouts hentes til siden for å gjøre om lenkene, og serveren deres ser da IP-adressen din.", "Klikker du på en slik lenke, kan partneren sette en informasjonskapsel på sitt eget nettsted for å se at du kom fra guiden. Det styres av partnerens personvernerklæring. Vi får bare opplysninger om provisjon, ikke hvem du er."]], ["Overføring utenfor EØS", ["Stripe, Cloudflare, Google og Resend kan behandle opplysninger i USA. Overføringen skjer etter rammeverket for personvern mellom EU og USA (Data Privacy Framework) eller EU-kommisjonens standard personvernbestemmelser."]], ["Dine rettigheter", ["Du har rett til å få vite hvilke opplysninger vi har om deg, få dem rettet eller slettet (unntatt det bokføringsloven krever at vi lagrer), protestere mot behandlingen og få utlevert opplysningene dine. Skriv til <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>.", "Er du misfornøyd, kan du klage til den svenske datatilsynsmyndigheten <a href=\"https://www.imy.se/\" rel=\"noopener\">IMY (imy.se)</a> eller Datatilsynet i Norge."]], ["Endringer", ["Vi oppdaterer erklæringen når guiden endres. Datoen nedenfor viser siste endring. Kjøpsvilkårene finner du på <a href=\"/villkor/\">pyreneestrip.com/villkor</a>."]]]}, "da": {"name": "Dansk", "back": "← Tilbage til guiden", "updated": "Senest opdateret 18. oktober 2026", "title": "Privatlivspolitik", "intro": "Sådan behandler pyreneestrip.com personoplysninger. Guiden kan bruges uden konto og uden at give personoplysninger, og vi bruger ingen cookies til reklame eller sporing.", "s": [["Hvem er ansvarlig", ["Dataansvarlig er Thomas Bajer (enkeltmandsvirksomhed), Sverige. Kontakt: <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>."]], ["Det, der gemmes i din browser", ["Min rejse, noter, egne cykelture, sprogvalg, filtre og dine køb gemmes i browserens lokale lager på din egen enhed. Det sendes ikke til os. Er du superbruger, gemmes også din personlige login-nøgle der.", "Installerer du guiden som app, gemmes sider og kortbilleder, du har set, så guiden virker uden net. Du sletter det hele ved at rydde webstedsdata for pyreneestrip.com i browseren."]], ["Besøgsstatistik og drift", ["Vi tæller besøg med Cloudflare Web Analytics: antal besøg, hvilke sider der læses, land og type enhed. Det sker uden cookies og uden, at du kan identificeres.", "Webstedet drives af Cloudflare, som behandler din IP-adresse teknisk for at levere siden og beskytte mod angreb. Statistikken fra Google Search Console viser, hvilke søgeord der fører til guiden, og indeholder ingen oplysninger om enkelte besøgende."]], ["Køb og betaling", ["Når du køber en guide eller GPX-fil eller bliver superbruger, håndteres betalingen af Stripe. Vi får din e-mailadresse, dit navn, land, hvad du har købt og beløbet – aldrig dine kortoplysninger.", "Oplysningerne bruges til at levere købet, sende kvittering, håndtere abonnementet, tilbagebetalinger og support. Retsgrundlaget er aftalen med dig. Bilagene gemmes i syv år, fordi den svenske bogføringslov kræver det."]], ["Superbruger og e-mail", ["Som superbruger knyttes abonnementet til dit kundenummer hos Stripe. Login-links sendes til din e-mailadresse via e-mailtjenesten Resend. Vi sender ingen markedsføring."]], ["Hvis du kontakter os", ["Skriver du til info@pyreneestrip.com, bruger vi din adresse og din besked til at svare og gemmer dem, så længe sagen kræver det."]], ["Indhold fra andre tjenester", ["For at guiden kan virke, henter din browser indhold direkte fra andre tjenester, som så ser din IP-adresse: kort fra OpenStreetMap, CyclOSM, OpenTopoMap, Waymarked Trails, OpenSnowMap og Esri (og Google Maps, hvis du vælger det kort), skrifttyper fra Google Fonts, programkode fra cdnjs og billeder fra Wikimedia Commons.", "Tegner du en egen cykeltur eller søger efter et sted, sendes punkterne eller søgeteksten til BRouter (brouter.de) og OpenStreetMaps søgning Nominatim."]], ["Partnerlinks", ["Nogle bookinglinks er annoncelinks, markeret med \"Annoncelink\", via Travelpayouts, CJ (Booking.com) og andre partnerprogrammer. Et script fra Travelpayouts hentes til siden for at omdanne linkene, og deres server ser da din IP-adresse.", "Klikker du på et sådant link, kan partneren sætte en cookie på sit eget websted for at se, at du kom fra guiden. Det styres af partnerens privatlivspolitik. Vi får kun oplysning om provision, ikke hvem du er."]], ["Overførsel uden for EU", ["Stripe, Cloudflare, Google og Resend kan behandle oplysninger i USA. Overførslen sker efter databeskyttelsesrammen mellem EU og USA (Data Privacy Framework) eller EU-Kommissionens standardkontraktbestemmelser."]], ["Dine rettigheder", ["Du har ret til at få at vide, hvilke oplysninger vi har om dig, få dem rettet eller slettet (undtagen det, bogføringsloven kræver, at vi gemmer), gøre indsigelse mod behandlingen og få udleveret dine oplysninger. Skriv til <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>.", "Er du utilfreds, kan du klage til den svenske tilsynsmyndighed <a href=\"https://www.imy.se/\" rel=\"noopener\">IMY (imy.se)</a> eller Datatilsynet i Danmark."]], ["Ændringer", ["Vi opdaterer politikken, når guiden ændres. Datoen nedenfor viser seneste ændring. Købsbetingelserne findes på <a href=\"/villkor/\">pyreneestrip.com/villkor</a>."]]]}, "en": {"name": "English", "back": "← Back to the guide", "updated": "Last updated 18 October 2026", "title": "Privacy policy", "intro": "How pyreneestrip.com handles personal data. You can use the guide without an account and without giving any personal data, and we use no cookies for advertising or tracking.", "s": [["Who is responsible", ["The data controller is Thomas Bajer (sole trader), Sweden. Contact: <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>."]], ["What is stored in your browser", ["My trip, notes, your own cycling routes, language, filters and your purchases are stored in the browser's local storage on your own device. None of it is sent to us. If you are a super user, your personal login key is stored there too.", "If you install the guide as an app, pages and map images you have viewed are saved so the guide works offline. You can delete everything by clearing site data for pyreneestrip.com in your browser."]], ["Visitor statistics and hosting", ["We count visits with Cloudflare Web Analytics: number of visits, pages read, country and device type. This works without cookies and without identifying you.", "The site is run on Cloudflare, which processes your IP address technically to deliver the page and protect against attacks. Statistics from Google Search Console show which search terms lead to the guide and contain no data about individual visitors."]], ["Purchases and payment", ["When you buy a guide or GPX file or become a super user, payment is handled by Stripe. We receive your email address, name, country, what you bought and the amount – never your card details.", "The data is used to deliver the purchase, send a receipt, manage the subscription, refunds and support. The legal basis is the contract with you. Records are kept for seven years because Swedish accounting law requires it."]], ["Super user and email", ["As a super user, your subscription is linked to your customer number at Stripe. Login links are sent to your email address via the email service Resend. We send no marketing."]], ["If you contact us", ["If you write to info@pyreneestrip.com, we use your address and message to reply and keep them as long as the matter requires."]], ["Content from other services", ["For the guide to work, your browser fetches content directly from other services, which then see your IP address: maps from OpenStreetMap, CyclOSM, OpenTopoMap, Waymarked Trails, OpenSnowMap and Esri (and Google Maps if you choose that map), fonts from Google Fonts, program code from cdnjs and images from Wikimedia Commons.", "If you draw your own cycling route or search for a place, the points or search text are sent to BRouter (brouter.de) and OpenStreetMap's Nominatim search."]], ["Affiliate links", ["Some booking links are affiliate links, marked \"Affiliate link\", via Travelpayouts, CJ (Booking.com) and other partner programmes. A script from Travelpayouts is loaded on the page to convert the links, and their server then sees your IP address.", "If you click such a link, the partner may set a cookie on its own website to see that you came from the guide. That is governed by the partner's privacy policy. We only receive commission data, not who you are."]], ["Transfers outside the EU", ["Stripe, Cloudflare, Google and Resend may process data in the United States. Transfers take place under the EU–US Data Privacy Framework or the European Commission's standard contractual clauses."]], ["Your rights", ["You have the right to know what data we hold about you, have it corrected or deleted (except what accounting law requires us to keep), object to the processing and receive a copy of your data. Write to <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>.", "If you are not satisfied, you can complain to the Swedish Authority for Privacy Protection, <a href=\"https://www.imy.se/en/\" rel=\"noopener\">IMY (imy.se)</a>, or the data protection authority in your country."]], ["Changes", ["We update this policy when the guide changes. The date below shows the latest change. The terms of purchase are at <a href=\"/villkor/\">pyreneestrip.com/villkor</a>."]]]}, "de": {"name": "Deutsch", "back": "← Zurück zum Reiseführer", "updated": "Zuletzt aktualisiert am 18. Oktober 2026", "title": "Datenschutzerklärung", "intro": "So geht pyreneestrip.com mit personenbezogenen Daten um. Sie können den Reiseführer ohne Konto und ohne Angabe personenbezogener Daten nutzen, und wir verwenden keine Cookies für Werbung oder Tracking.", "s": [["Verantwortlicher", ["Verantwortlich ist Thomas Bajer (Einzelunternehmen), Schweden. Kontakt: <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>."]], ["Was in Ihrem Browser gespeichert wird", ["Meine Reise, Notizen, eigene Radtouren, Sprache, Filter und Ihre Käufe werden im lokalen Speicher des Browsers auf Ihrem eigenen Gerät gespeichert. Nichts davon wird an uns übermittelt. Als Super-Nutzer wird dort auch Ihr persönlicher Anmeldeschlüssel gespeichert.", "Installieren Sie den Reiseführer als App, werden angesehene Seiten und Kartenbilder gespeichert, damit er offline funktioniert. Sie löschen alles, indem Sie die Websitedaten für pyreneestrip.com im Browser entfernen."]], ["Besucherstatistik und Hosting", ["Wir zählen Besuche mit Cloudflare Web Analytics: Anzahl der Besuche, gelesene Seiten, Land und Gerätetyp. Das geschieht ohne Cookies und ohne dass Sie identifiziert werden.", "Die Website wird bei Cloudflare betrieben, das Ihre IP-Adresse technisch verarbeitet, um die Seite auszuliefern und vor Angriffen zu schützen. Die Statistik aus der Google Search Console zeigt, welche Suchbegriffe zum Reiseführer führen, und enthält keine Daten über einzelne Besucher."]], ["Kauf und Zahlung", ["Wenn Sie einen Reiseführer oder eine GPX-Datei kaufen oder Super-Nutzer werden, wird die Zahlung von Stripe abgewickelt. Wir erhalten Ihre E-Mail-Adresse, Ihren Namen, Ihr Land, den Kaufgegenstand und den Betrag – nie Ihre Kartendaten.", "Die Daten dienen dazu, den Kauf zu liefern, den Beleg zu senden, das Abonnement, Erstattungen und den Support abzuwickeln. Rechtsgrundlage ist der Vertrag mit Ihnen. Die Unterlagen werden sieben Jahre aufbewahrt, weil das schwedische Buchführungsgesetz es verlangt."]], ["Super-Nutzer und E-Mail", ["Als Super-Nutzer ist Ihr Abonnement mit Ihrer Kundennummer bei Stripe verknüpft. Anmeldelinks werden über den E-Mail-Dienst Resend an Ihre E-Mail-Adresse gesendet. Wir versenden keine Werbung."]], ["Wenn Sie uns kontaktieren", ["Schreiben Sie an info@pyreneestrip.com, verwenden wir Ihre Adresse und Ihre Nachricht für die Antwort und speichern sie, solange die Angelegenheit es erfordert."]], ["Inhalte anderer Dienste", ["Damit der Reiseführer funktioniert, lädt Ihr Browser Inhalte direkt von anderen Diensten, die dabei Ihre IP-Adresse sehen: Karten von OpenStreetMap, CyclOSM, OpenTopoMap, Waymarked Trails, OpenSnowMap und Esri (und Google Maps, wenn Sie diese Karte wählen), Schriften von Google Fonts, Programmcode von cdnjs und Bilder von Wikimedia Commons.", "Zeichnen Sie eine eigene Radtour oder suchen Sie einen Ort, werden die Punkte oder der Suchtext an BRouter (brouter.de) und die OpenStreetMap-Suche Nominatim übermittelt."]], ["Partnerlinks", ["Einige Buchungslinks sind Werbelinks, gekennzeichnet mit \"Werbelink\", über Travelpayouts, CJ (Booking.com) und andere Partnerprogramme. Ein Skript von Travelpayouts wird auf der Seite geladen, um die Links umzuwandeln; dessen Server sieht dabei Ihre IP-Adresse.", "Klicken Sie auf einen solchen Link, kann der Partner auf seiner eigenen Website ein Cookie setzen, um zu erkennen, dass Sie vom Reiseführer kamen. Dafür gilt die Datenschutzerklärung des Partners. Wir erhalten nur Angaben zur Provision, nicht wer Sie sind."]], ["Übermittlung außerhalb der EU", ["Stripe, Cloudflare, Google und Resend können Daten in den USA verarbeiten. Die Übermittlung erfolgt auf Grundlage des EU-US-Datenschutzrahmens (Data Privacy Framework) oder der Standardvertragsklauseln der EU-Kommission."]], ["Ihre Rechte", ["Sie haben das Recht auf Auskunft über Ihre Daten, auf Berichtigung oder Löschung (außer dem, was das Buchführungsgesetz zu speichern verlangt), auf Widerspruch gegen die Verarbeitung und auf Herausgabe Ihrer Daten. Schreiben Sie an <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>.", "Wenn Sie unzufrieden sind, können Sie sich bei der schwedischen Datenschutzbehörde <a href=\"https://www.imy.se/en/\" rel=\"noopener\">IMY (imy.se)</a> oder der Datenschutzbehörde in Ihrem Land beschweren."]], ["Änderungen", ["Wir aktualisieren diese Erklärung, wenn sich der Reiseführer ändert. Das Datum unten zeigt die letzte Änderung. Die Kaufbedingungen finden Sie unter <a href=\"/villkor/\">pyreneestrip.com/villkor</a>."]]]}, "fr": {"name": "Français", "back": "← Retour au guide", "updated": "Dernière mise à jour : 18 octobre 2026", "title": "Politique de confidentialité", "intro": "Comment pyreneestrip.com traite les données personnelles. Le guide s'utilise sans compte et sans fournir de données personnelles, et nous n'utilisons aucun cookie publicitaire ou de suivi.", "s": [["Responsable du traitement", ["Le responsable du traitement est Thomas Bajer (entreprise individuelle), Suède. Contact : <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>."]], ["Ce qui est enregistré dans votre navigateur", ["Mon voyage, vos notes, vos parcours à vélo, la langue, les filtres et vos achats sont enregistrés dans le stockage local du navigateur, sur votre propre appareil. Rien n'est envoyé chez nous. Si vous êtes super-utilisateur, votre clé de connexion personnelle y est aussi enregistrée.", "Si vous installez le guide comme application, les pages et cartes consultées sont conservées pour qu'il fonctionne hors ligne. Vous effacez tout en supprimant les données du site pyreneestrip.com dans votre navigateur."]], ["Statistiques de visite et hébergement", ["Nous comptons les visites avec Cloudflare Web Analytics : nombre de visites, pages lues, pays et type d'appareil. Cela fonctionne sans cookies et sans vous identifier.", "Le site est hébergé chez Cloudflare, qui traite techniquement votre adresse IP pour fournir la page et la protéger contre les attaques. Les statistiques de Google Search Console montrent quels mots-clés mènent au guide et ne contiennent aucune donnée sur les visiteurs individuels."]], ["Achats et paiement", ["Lorsque vous achetez un guide ou un fichier GPX ou devenez super-utilisateur, le paiement est géré par Stripe. Nous recevons votre adresse e-mail, votre nom, votre pays, l'objet de l'achat et le montant – jamais vos données de carte.", "Ces données servent à livrer l'achat, envoyer le reçu, gérer l'abonnement, les remboursements et le support. La base légale est le contrat conclu avec vous. Les justificatifs sont conservés sept ans, comme l'exige la loi comptable suédoise."]], ["Super-utilisateur et e-mail", ["En tant que super-utilisateur, votre abonnement est lié à votre numéro de client chez Stripe. Les liens de connexion sont envoyés à votre adresse e-mail via le service d'e-mail Resend. Nous n'envoyons aucune publicité."]], ["Si vous nous contactez", ["Si vous écrivez à info@pyreneestrip.com, nous utilisons votre adresse et votre message pour vous répondre et les conservons aussi longtemps que nécessaire."]], ["Contenus d'autres services", ["Pour que le guide fonctionne, votre navigateur charge des contenus directement depuis d'autres services, qui voient alors votre adresse IP : cartes d'OpenStreetMap, CyclOSM, OpenTopoMap, Waymarked Trails, OpenSnowMap et Esri (et Google Maps si vous choisissez cette carte), polices de Google Fonts, code de cdnjs et images de Wikimedia Commons.", "Si vous tracez votre propre parcours à vélo ou cherchez un lieu, les points ou le texte recherché sont envoyés à BRouter (brouter.de) et à Nominatim, la recherche d'OpenStreetMap."]], ["Liens partenaires", ["Certains liens de réservation sont des liens d'affiliation, marqués « Lien affilié », via Travelpayouts, CJ (Booking.com) et d'autres programmes partenaires. Un script de Travelpayouts est chargé sur la page pour convertir les liens ; son serveur voit alors votre adresse IP.", "Si vous cliquez sur un tel lien, le partenaire peut déposer un cookie sur son propre site pour savoir que vous venez du guide. Cela relève de la politique de confidentialité du partenaire. Nous ne recevons que des informations sur la commission, pas votre identité."]], ["Transferts hors de l'UE", ["Stripe, Cloudflare, Google et Resend peuvent traiter des données aux États-Unis. Les transferts reposent sur le cadre de protection des données UE–États-Unis (Data Privacy Framework) ou les clauses contractuelles types de la Commission européenne."]], ["Vos droits", ["Vous avez le droit de savoir quelles données nous détenons sur vous, de les faire rectifier ou effacer (sauf ce que la loi comptable nous oblige à conserver), de vous opposer au traitement et d'obtenir une copie de vos données. Écrivez à <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>.", "En cas de désaccord, vous pouvez saisir l'autorité suédoise de protection des données, <a href=\"https://www.imy.se/en/\" rel=\"noopener\">IMY (imy.se)</a>, ou l'autorité de votre pays (en France, la CNIL)."]], ["Modifications", ["Nous mettons cette politique à jour lorsque le guide évolue. La date ci-dessous indique la dernière modification. Les conditions d'achat se trouvent sur <a href=\"/villkor/\">pyreneestrip.com/villkor</a>."]]]}, "es": {"name": "Español", "back": "← Volver a la guía", "updated": "Última actualización: 18 de octubre de 2026", "title": "Política de privacidad", "intro": "Así trata pyreneestrip.com los datos personales. Puedes usar la guía sin cuenta y sin facilitar datos personales, y no usamos cookies de publicidad ni de seguimiento.", "s": [["Responsable", ["El responsable del tratamiento es Thomas Bajer (empresario individual), Suecia. Contacto: <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>."]], ["Lo que se guarda en tu navegador", ["Mi viaje, notas, tus rutas en bici, idioma, filtros y tus compras se guardan en el almacenamiento local del navegador, en tu propio dispositivo. Nada de eso se nos envía. Si eres superusuario, también se guarda ahí tu clave personal de acceso.", "Si instalas la guía como aplicación, se guardan las páginas y mapas que has visto para que funcione sin conexión. Puedes borrarlo todo eliminando los datos del sitio pyreneestrip.com en el navegador."]], ["Estadísticas de visitas y alojamiento", ["Contamos las visitas con Cloudflare Web Analytics: número de visitas, páginas leídas, país y tipo de dispositivo. Funciona sin cookies y sin identificarte.", "El sitio funciona en Cloudflare, que trata tu dirección IP técnicamente para servir la página y protegerla de ataques. Las estadísticas de Google Search Console muestran qué búsquedas llevan a la guía y no contienen datos de visitantes individuales."]], ["Compras y pago", ["Cuando compras una guía o un archivo GPX o te haces superusuario, el pago lo gestiona Stripe. Recibimos tu correo electrónico, nombre, país, lo que has comprado y el importe; nunca los datos de tu tarjeta.", "Los datos se usan para entregar la compra, enviar el recibo y gestionar la suscripción, los reembolsos y el soporte. La base jurídica es el contrato contigo. Los justificantes se conservan siete años porque lo exige la ley de contabilidad sueca."]], ["Superusuario y correo electrónico", ["Como superusuario, tu suscripción está vinculada a tu número de cliente en Stripe. Los enlaces de acceso se envían a tu correo mediante el servicio de correo Resend. No enviamos publicidad."]], ["Si nos escribes", ["Si escribes a info@pyreneestrip.com, usamos tu dirección y tu mensaje para responder y los conservamos mientras el asunto lo requiera."]], ["Contenido de otros servicios", ["Para que la guía funcione, tu navegador carga contenido directamente de otros servicios, que ven tu dirección IP: mapas de OpenStreetMap, CyclOSM, OpenTopoMap, Waymarked Trails, OpenSnowMap y Esri (y Google Maps si eliges ese mapa), fuentes de Google Fonts, código de cdnjs e imágenes de Wikimedia Commons.", "Si dibujas tu propia ruta en bici o buscas un lugar, los puntos o el texto de búsqueda se envían a BRouter (brouter.de) y a Nominatim, el buscador de OpenStreetMap."]], ["Enlaces de afiliados", ["Algunos enlaces de reserva son enlaces de afiliado, marcados como «Enlace de afiliado», a través de Travelpayouts, CJ (Booking.com) y otros programas. En la página se carga un script de Travelpayouts para convertir los enlaces, y su servidor ve entonces tu dirección IP.", "Si haces clic en uno de esos enlaces, el socio puede poner una cookie en su propio sitio para saber que vienes de la guía. Eso se rige por la política de privacidad del socio. Solo recibimos datos de comisión, no quién eres."]], ["Transferencias fuera de la UE", ["Stripe, Cloudflare, Google y Resend pueden tratar datos en Estados Unidos. Las transferencias se basan en el Marco de Privacidad de Datos UE-EE. UU. o en las cláusulas contractuales tipo de la Comisión Europea."]], ["Tus derechos", ["Tienes derecho a saber qué datos tenemos sobre ti, a rectificarlos o suprimirlos (salvo lo que la ley de contabilidad nos obliga a conservar), a oponerte al tratamiento y a recibir una copia de tus datos. Escribe a <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>.", "Si no estás conforme, puedes reclamar ante la autoridad sueca de protección de datos, <a href=\"https://www.imy.se/en/\" rel=\"noopener\">IMY (imy.se)</a>, o ante la de tu país (en España, la AEPD)."]], ["Cambios", ["Actualizamos esta política cuando cambia la guía. La fecha de abajo indica el último cambio. Las condiciones de compra están en <a href=\"/villkor/\">pyreneestrip.com/villkor</a>."]]]}, "it": {"name": "Italiano", "back": "← Torna alla guida", "updated": "Ultimo aggiornamento: 18 ottobre 2026", "title": "Informativa sulla privacy", "intro": "Come pyreneestrip.com tratta i dati personali. Puoi usare la guida senza account e senza fornire dati personali, e non usiamo cookie pubblicitari o di tracciamento.", "s": [["Titolare del trattamento", ["Il titolare del trattamento è Thomas Bajer (ditta individuale), Svezia. Contatto: <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>."]], ["Cosa viene salvato nel tuo browser", ["Il mio viaggio, le note, i tuoi percorsi in bici, la lingua, i filtri e i tuoi acquisti sono salvati nella memoria locale del browser, sul tuo dispositivo. Niente viene inviato a noi. Se sei super utente, vi è salvata anche la tua chiave di accesso personale.", "Se installi la guida come app, le pagine e le mappe consultate vengono salvate perché funzioni offline. Puoi cancellare tutto eliminando i dati del sito pyreneestrip.com nel browser."]], ["Statistiche delle visite e hosting", ["Contiamo le visite con Cloudflare Web Analytics: numero di visite, pagine lette, paese e tipo di dispositivo. Funziona senza cookie e senza identificarti.", "Il sito è ospitato su Cloudflare, che tratta tecnicamente il tuo indirizzo IP per fornire la pagina e proteggerla dagli attacchi. Le statistiche di Google Search Console mostrano quali ricerche portano alla guida e non contengono dati sui singoli visitatori."]], ["Acquisti e pagamento", ["Quando acquisti una guida o un file GPX o diventi super utente, il pagamento è gestito da Stripe. Riceviamo il tuo indirizzo e-mail, il nome, il paese, cosa hai acquistato e l'importo: mai i dati della carta.", "I dati servono a consegnare l'acquisto, inviare la ricevuta, gestire l'abbonamento, i rimborsi e l'assistenza. La base giuridica è il contratto con te. La documentazione è conservata sette anni come richiesto dalla legge contabile svedese."]], ["Super utente ed e-mail", ["Come super utente, il tuo abbonamento è collegato al tuo numero cliente presso Stripe. I link di accesso sono inviati al tuo indirizzo e-mail tramite il servizio di posta Resend. Non inviamo pubblicità."]], ["Se ci contatti", ["Se scrivi a info@pyreneestrip.com, usiamo il tuo indirizzo e il messaggio per rispondere e li conserviamo per il tempo necessario."]], ["Contenuti di altri servizi", ["Perché la guida funzioni, il tuo browser carica contenuti direttamente da altri servizi, che vedono il tuo indirizzo IP: mappe di OpenStreetMap, CyclOSM, OpenTopoMap, Waymarked Trails, OpenSnowMap ed Esri (e Google Maps se scegli quella mappa), caratteri di Google Fonts, codice di cdnjs e immagini di Wikimedia Commons.", "Se disegni un percorso in bici o cerchi un luogo, i punti o il testo cercato sono inviati a BRouter (brouter.de) e a Nominatim, la ricerca di OpenStreetMap."]], ["Link di affiliazione", ["Alcuni link di prenotazione sono link di affiliazione, contrassegnati come «Link di affiliazione», tramite Travelpayouts, CJ (Booking.com) e altri programmi. Sulla pagina viene caricato uno script di Travelpayouts per convertire i link; il loro server vede quindi il tuo indirizzo IP.", "Se clicchi su uno di questi link, il partner può impostare un cookie sul proprio sito per sapere che arrivi dalla guida. Ciò è regolato dall'informativa del partner. Riceviamo solo dati sulle commissioni, non chi sei."]], ["Trasferimenti fuori dall'UE", ["Stripe, Cloudflare, Google e Resend possono trattare dati negli Stati Uniti. I trasferimenti avvengono in base al quadro UE-USA per la protezione dei dati (Data Privacy Framework) o alle clausole contrattuali tipo della Commissione europea."]], ["I tuoi diritti", ["Hai diritto di sapere quali dati abbiamo su di te, di farli rettificare o cancellare (salvo quanto la legge contabile ci impone di conservare), di opporti al trattamento e di riceverne una copia. Scrivi a <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>.", "Se non sei soddisfatto, puoi presentare reclamo all'autorità svedese per la protezione dei dati, <a href=\"https://www.imy.se/en/\" rel=\"noopener\">IMY (imy.se)</a>, o a quella del tuo paese (in Italia, il Garante privacy)."]], ["Modifiche", ["Aggiorniamo l'informativa quando la guida cambia. La data qui sotto indica l'ultima modifica. Le condizioni di acquisto sono su <a href=\"/villkor/\">pyreneestrip.com/villkor</a>."]]]}, "pt": {"name": "Português", "back": "← Voltar ao guia", "updated": "Última atualização: 18 de outubro de 2026", "title": "Política de privacidade", "intro": "Como o pyreneestrip.com trata dados pessoais. Pode usar o guia sem conta e sem fornecer dados pessoais, e não usamos cookies de publicidade nem de rastreio.", "s": [["Responsável", ["O responsável pelo tratamento é Thomas Bajer (empresário em nome individual), Suécia. Contacto: <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>."]], ["O que fica guardado no seu navegador", ["A minha viagem, notas, os seus percursos de bicicleta, idioma, filtros e as suas compras ficam guardados no armazenamento local do navegador, no seu próprio dispositivo. Nada disso nos é enviado. Se for superutilizador, a sua chave pessoal de acesso também fica guardada aí.", "Se instalar o guia como aplicação, as páginas e mapas que viu são guardados para que funcione sem rede. Pode apagar tudo eliminando os dados do site pyreneestrip.com no navegador."]], ["Estatísticas de visitas e alojamento", ["Contamos as visitas com o Cloudflare Web Analytics: número de visitas, páginas lidas, país e tipo de dispositivo. Funciona sem cookies e sem o identificar.", "O site funciona na Cloudflare, que trata tecnicamente o seu endereço IP para entregar a página e protegê-la de ataques. As estatísticas do Google Search Console mostram que pesquisas levam ao guia e não contêm dados de visitantes individuais."]], ["Compras e pagamento", ["Quando compra um guia ou ficheiro GPX ou se torna superutilizador, o pagamento é gerido pela Stripe. Recebemos o seu e-mail, nome, país, o que comprou e o montante – nunca os dados do cartão.", "Os dados servem para entregar a compra, enviar o recibo e gerir a assinatura, reembolsos e apoio. A base jurídica é o contrato consigo. Os registos são guardados durante sete anos porque a lei contabilística sueca o exige."]], ["Superutilizador e e-mail", ["Como superutilizador, a sua assinatura está ligada ao seu número de cliente na Stripe. As ligações de acesso são enviadas para o seu e-mail através do serviço de e-mail Resend. Não enviamos publicidade."]], ["Se nos contactar", ["Se escrever para info@pyreneestrip.com, usamos o seu endereço e a sua mensagem para responder e guardamo-los enquanto o assunto o exigir."]], ["Conteúdos de outros serviços", ["Para que o guia funcione, o seu navegador carrega conteúdos diretamente de outros serviços, que veem o seu endereço IP: mapas do OpenStreetMap, CyclOSM, OpenTopoMap, Waymarked Trails, OpenSnowMap e Esri (e Google Maps se escolher esse mapa), tipos de letra do Google Fonts, código do cdnjs e imagens do Wikimedia Commons.", "Se desenhar o seu próprio percurso de bicicleta ou procurar um local, os pontos ou o texto da pesquisa são enviados para o BRouter (brouter.de) e para o Nominatim, a pesquisa do OpenStreetMap."]], ["Ligações de afiliados", ["Algumas ligações de reserva são ligações de afiliado, assinaladas como «Link de afiliado», através da Travelpayouts, da CJ (Booking.com) e de outros programas. É carregado na página um script da Travelpayouts para converter as ligações, e o servidor deles vê então o seu endereço IP.", "Se clicar numa dessas ligações, o parceiro pode colocar um cookie no seu próprio site para saber que veio do guia. Isso rege-se pela política de privacidade do parceiro. Só recebemos dados sobre comissões, não quem é."]], ["Transferências para fora da UE", ["A Stripe, a Cloudflare, a Google e a Resend podem tratar dados nos Estados Unidos. As transferências baseiam-se no Quadro de Privacidade de Dados UE-EUA (Data Privacy Framework) ou nas cláusulas contratuais-tipo da Comissão Europeia."]], ["Os seus direitos", ["Tem direito a saber que dados temos sobre si, a corrigi-los ou apagá-los (exceto o que a lei contabilística nos obriga a guardar), a opor-se ao tratamento e a receber uma cópia dos seus dados. Escreva para <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>.", "Se não estiver satisfeito, pode apresentar queixa à autoridade sueca de proteção de dados, <a href=\"https://www.imy.se/en/\" rel=\"noopener\">IMY (imy.se)</a>, ou à do seu país (em Portugal, a CNPD)."]], ["Alterações", ["Atualizamos esta política quando o guia muda. A data abaixo indica a última alteração. As condições de compra estão em <a href=\"/villkor/\">pyreneestrip.com/villkor</a>."]]]}};
