<script>
var T = {"sv": {"name": "Svenska", "back": "← Tillbaka till guiden", "updated": "Senast uppdaterad 18 oktober 2026", "title": "Köpvillkor, återbetalning och kontakt", "intro": "Webbguiden är gratis att använda. De här villkoren gäller när du köper en reseguide eller GPX-filer på pyreneestrip.com.", "s": [["Säljare och kontakt", ["Säljare är Thomas Bajer (enskild firma), Sverige.", "E-post: <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>. Vi svarar normalt inom två arbetsdagar."]], ["Vad du köper", ["Digitala produkter: egna reseguider som du sätter ihop på webbplatsen, Thomas färdiga guider och GPX-filer med cykel- och vandringsrutter. Guiden levereras som en fil som du öppnar i webbläsaren och kan skriva ut eller spara som PDF. GPX-filerna fungerar i GPS-enheter och kartappar.", "Du får en personlig kopia för eget bruk. Den får inte säljas eller spridas vidare."]], ["Priser och betalning", ["Priset visas i köpdialogen innan du betalar och är slutpris i angiven valuta (SEK, NOK, DKK eller EUR). Enstaka köp betalar du en gång. Superanvändare är ett årsabonnemang, se nedan.", "Betalningen hanteras av Stripe. Vi ser aldrig dina kortuppgifter."]], ["Leverans", ["Filen laddas ner direkt när betalningen är klar. Med köplänken kan du ladda ner den igen i 30 dagar, även från en annan enhet. Kvittot skickas till den e-postadress du anger vid betalningen."]], ["Superanvändare (årsabonnemang)", ["Som superanvändare kan du under abonnemangstiden ladda ner alla egna guider, Thomas färdiga guider och alla GPX-filer på webbplatsen utan att betala för varje nedladdning. Det du har laddat ner får du behålla.", "Priset per år visas innan du betalar. Abonnemanget förnyas automatiskt varje år och dras från samma betalsätt tills du säger upp det. Du kan säga upp det när som helst under Om guiden → Superanvändare → Hantera abonnemang eller genom att skriva till oss. Uppsägningen gäller från nästa förnyelse och du behåller tillgången året ut.", "Du loggar in med den personliga länk du får efter köpet och med e-post. Länken är personlig och får inte delas med andra.", "Samma regler om ångerrätt gäller som för andra köp: du samtycker i köpdialogen till att tillgången börjar direkt."]], ["Ångerrätt", ["Vid köp på distans har du normalt 14 dagars ångerrätt. För digitalt innehåll som levereras direkt gäller den inte om du uttryckligen har samtyckt till att leveransen börjar direkt och bekräftat att ångerrätten då upphör (2 kap. 11 § 13 lagen om distansavtal och avtal utanför affärslokaler).", "Det samtycket lämnar du genom att kryssa i rutan i köpdialogen innan du betalar."]], ["Återbetalning", ["Du får hela beloppet tillbaka om nedladdningen inte fungerar och vi inte kan lösa det, om filen är trasig eller tydligt avviker från beskrivningen, eller om du har debiterats två gånger för samma köp.", "Skriv till <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a> inom 30 dagar och bifoga kvittot. Pengarna betalas tillbaka till samma betalsätt inom 14 dagar från att vi godkänt återbetalningen.", "Dina lagstadgade rättigheter vid fel i digitalt innehåll gäller alltid."]], ["Innehållet i guiden", ["Guiden är skriven med omsorg, men priser, öppettider, vägar och förhållanden i bergen ändras. Kontrollera alltid på plats. Vandring, cykling, klättring och skidåkning sker på egen risk."]], ["Bokningslänkar", ["En del länkar till flyg, boende, hyrbil, cykeluthyrning och aktiviteter är annonslänkar och märkta med \"Annonslänk\". Bokar du via dem kan vi få provision, utan extra kostnad för dig. Bokningen görs direkt med respektive företag och deras villkor gäller."]], ["Personuppgifter", ["Stripe hanterar betalningen. Vi får din e-postadress och uppgifter om köpet och använder dem bara för leverans, kvitto och support. Köpuppgifterna sparas så länge bokföringslagen kräver.", "Det du gör i guiden, som Min resa och egna turer, sparas bara i din egen webbläsare.", "Läs mer i vår <a href=\"/integritet/\">integritetspolicy</a>."]], ["Klagomål och tvister", ["Kontakta oss först, så löser vi det. Blir vi inte överens kan du vända dig till Allmänna reklamationsnämnden, <a href=\"https://www.arn.se/\" rel=\"noopener\">ARN (arn.se)</a>. Bor du i ett annat EU-land kan du få hjälp av <a href=\"https://www.konsumenteuropa.se/\" rel=\"noopener\">Konsument Europa</a>.", "Svensk lag gäller. Det påverkar inte det konsumentskydd du har enligt lagen i ditt hemland."]]]}, "no": {"name": "Norsk", "back": "← Tilbake til guiden", "updated": "Sist oppdatert 18. oktober 2026", "title": "Kjøpsvilkår, refusjon og kontakt", "intro": "Nettguiden er gratis å bruke. Disse vilkårene gjelder når du kjøper en reiseguide eller GPX-filer på pyreneestrip.com.", "s": [["Selger og kontakt", ["Selger er Thomas Bajer (enkeltpersonforetak), Sverige.", "E-post: <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>. Vi svarer normalt innen to virkedager."]], ["Hva du kjøper", ["Digitale produkter: egne reiseguider som du setter sammen på nettstedet, Thomas' ferdige guider og GPX-filer med sykkel- og turruter. Guiden leveres som en fil du åpner i nettleseren og kan skrive ut eller lagre som PDF. GPX-filene fungerer i GPS-enheter og kartapper.", "Du får en personlig kopi til eget bruk. Den kan ikke selges eller spres videre."]], ["Priser og betaling", ["Prisen vises i kjøpsdialogen før du betaler og er sluttpris i oppgitt valuta (SEK, NOK, DKK eller EUR). Enkeltkjøp betaler du én gang. Superbruker er et årsabonnement, se nedenfor.", "Betalingen håndteres av Stripe. Vi ser aldri kortopplysningene dine."]], ["Levering", ["Filen lastes ned straks betalingen er gjennomført. Med kjøpslenken kan du laste den ned igjen i 30 dager, også fra en annen enhet. Kvitteringen sendes til e-postadressen du oppgir ved betalingen."]], ["Superbruker (årsabonnement)", ["Som superbruker kan du i abonnementsperioden laste ned alle egne guider, Thomas' ferdige guider og alle GPX-filer på nettstedet uten å betale for hver nedlasting. Det du har lastet ned, får du beholde.", "Prisen per år vises før du betaler. Abonnementet fornyes automatisk hvert år og trekkes fra samme betalingsmåte til du sier det opp. Du kan si det opp når som helst under Om guiden → Superbruker → Administrer abonnement eller ved å skrive til oss. Oppsigelsen gjelder fra neste fornyelse, og du beholder tilgangen året ut.", "Du logger inn med den personlige lenken du får etter kjøpet og på e-post. Lenken er personlig og skal ikke deles med andre.", "De samme reglene om angrerett gjelder som for andre kjøp: du samtykker i kjøpsdialogen til at tilgangen starter med en gang."]], ["Angrerett", ["Ved kjøp på avstand har du normalt 14 dagers angrerett. For digitalt innhold som leveres straks gjelder den ikke når du uttrykkelig har samtykket til at leveringen starter straks og bekreftet at angreretten da faller bort (EUs forbrukerrettighetsdirektiv 2011/83/EU art. 16 m).", "Dette samtykket gir du ved å krysse av i boksen i kjøpsdialogen før du betaler."]], ["Refusjon", ["Du får hele beløpet tilbake hvis nedlastingen ikke fungerer og vi ikke klarer å løse det, hvis filen er ødelagt eller tydelig avviker fra beskrivelsen, eller hvis du er belastet to ganger for samme kjøp.", "Skriv til <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a> innen 30 dager og legg ved kvitteringen. Pengene betales tilbake til samme betalingsmåte innen 14 dager etter at vi har godkjent refusjonen.", "Dine lovfestede rettigheter ved feil i digitalt innhold gjelder alltid."]], ["Innholdet i guiden", ["Guiden er skrevet med omhu, men priser, åpningstider, veier og forhold i fjellet endrer seg. Sjekk alltid på stedet. Fjellturer, sykling, klatring og skikjøring skjer på egen risiko."]], ["Bestillingslenker", ["Noen lenker til fly, overnatting, leiebil, sykkelutleie og aktiviteter er annonselenker og merket med \"Annonselenke\". Bestiller du via dem, kan vi få provisjon uten ekstra kostnad for deg. Bestillingen gjøres direkte med det aktuelle selskapet, og deres vilkår gjelder."]], ["Personopplysninger", ["Stripe håndterer betalingen. Vi får e-postadressen din og opplysninger om kjøpet og bruker dem bare til levering, kvittering og kundestøtte. Kjøpsopplysningene lagres så lenge regnskapsreglene krever.", "Det du gjør i guiden, som Min reise og egne turer, lagres bare i din egen nettleser.", "Les mer i vår <a href=\"/integritet/\">personvernerklæring</a>."]], ["Klager og tvister", ["Kontakt oss først, så løser vi det. Blir vi ikke enige, kan du få hjelp av <a href=\"https://forbrukereuropa.no/\" rel=\"noopener\">Forbruker Europa</a>, siden selgeren er i Sverige. Den svenske klagenemnda er <a href=\"https://www.arn.se/\" rel=\"noopener\">ARN (arn.se)</a>.", "Svensk lov gjelder. Det påvirker ikke forbrukervernet du har etter loven i hjemlandet ditt."]]]}, "da": {"name": "Dansk", "back": "← Tilbage til guiden", "updated": "Senest opdateret 18. oktober 2026", "title": "Købsbetingelser, refusion og kontakt", "intro": "Webguiden er gratis at bruge. Disse betingelser gælder, når du køber en rejseguide eller GPX-filer på pyreneestrip.com.", "s": [["Sælger og kontakt", ["Sælger er Thomas Bajer (enkeltmandsvirksomhed), Sverige.", "E-mail: <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>. Vi svarer normalt inden for to hverdage."]], ["Hvad du køber", ["Digitale produkter: egne rejseguider, som du sætter sammen på hjemmesiden, Thomas' færdige guider og GPX-filer med cykel- og vandreruter. Guiden leveres som en fil, du åbner i browseren og kan udskrive eller gemme som PDF. GPX-filerne virker i GPS-enheder og kortapps.", "Du får en personlig kopi til eget brug. Den må ikke sælges eller videredeles."]], ["Priser og betaling", ["Prisen vises i købsdialogen, før du betaler, og er slutpris i den angivne valuta (SEK, NOK, DKK eller EUR). Enkeltkøb betaler du én gang. Superbruger er et årsabonnement, se nedenfor.", "Betalingen håndteres af Stripe. Vi ser aldrig dine kortoplysninger."]], ["Levering", ["Filen downloades, så snart betalingen er gennemført. Med købslinket kan du downloade den igen i 30 dage, også fra en anden enhed. Kvitteringen sendes til den e-mailadresse, du angiver ved betalingen."]], ["Superbruger (årsabonnement)", ["Som superbruger kan du i abonnementsperioden downloade alle egne guider, Thomas' færdige guider og alle GPX-filer på webstedet uden at betale for hver download. Det, du har downloadet, må du beholde.", "Prisen pr. år vises, før du betaler. Abonnementet fornyes automatisk hvert år og trækkes fra samme betalingsmåde, indtil du opsiger det. Du kan opsige det når som helst under Om guiden → Superbruger → Administrer abonnement eller ved at skrive til os. Opsigelsen gælder fra næste fornyelse, og du beholder adgangen året ud.", "Du logger ind med det personlige link, du får efter købet og på e-mail. Linket er personligt og må ikke deles med andre.", "De samme regler om fortrydelsesret gælder som for andre køb: du giver i købsdialogen samtykke til, at adgangen begynder med det samme."]], ["Fortrydelsesret", ["Ved køb på afstand har du normalt 14 dages fortrydelsesret. For digitalt indhold, der leveres med det samme, gælder den ikke, når du udtrykkeligt har givet samtykke til, at leveringen begynder med det samme, og bekræftet, at fortrydelsesretten dermed bortfalder (EU-direktiv 2011/83/EU art. 16, litra m).", "Det samtykke giver du ved at sætte flueben i feltet i købsdialogen, før du betaler."]], ["Refusion", ["Du får hele beløbet tilbage, hvis downloadet ikke virker, og vi ikke kan løse det, hvis filen er defekt eller tydeligt afviger fra beskrivelsen, eller hvis du er blevet trukket to gange for samme køb.", "Skriv til <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a> inden 30 dage, og vedhæft kvitteringen. Pengene betales tilbage til samme betalingsmiddel inden 14 dage efter, at vi har godkendt refusionen.", "Dine lovbestemte rettigheder ved fejl i digitalt indhold gælder altid."]], ["Indholdet i guiden", ["Guiden er skrevet med omhu, men priser, åbningstider, veje og forholdene i bjergene ændrer sig. Tjek altid på stedet. Vandring, cykling, klatring og skiløb sker på eget ansvar."]], ["Bookinglinks", ["Nogle links til fly, overnatning, lejebil, cykeludlejning og aktiviteter er annoncelinks og mærket \"Annoncelink\". Booker du via dem, kan vi få provision uden ekstra omkostninger for dig. Bookingen sker direkte hos den pågældende virksomhed, og deres betingelser gælder."]], ["Personoplysninger", ["Stripe håndterer betalingen. Vi får din e-mailadresse og oplysninger om købet og bruger dem kun til levering, kvittering og support. Købsoplysningerne gemmes, så længe bogføringsreglerne kræver det.", "Det, du laver i guiden, som Min rejse og egne ture, gemmes kun i din egen browser.", "Læs mere i vores <a href=\"/integritet/\">privatlivspolitik</a>."]], ["Klager og tvister", ["Kontakt os først, så finder vi en løsning. Bliver vi ikke enige, kan du få hjælp af <a href=\"https://www.forbrugereuropa.dk/\" rel=\"noopener\">Forbrugereuropa</a>, da sælgeren er i Sverige. Det svenske klagenævn er <a href=\"https://www.arn.se/\" rel=\"noopener\">ARN (arn.se)</a>.", "Svensk ret gælder. Det påvirker ikke den forbrugerbeskyttelse, du har efter loven i dit hjemland."]]]}, "en": {"name": "English", "back": "← Back to the guide", "updated": "Last updated 18 October 2026", "title": "Terms of purchase, refunds and contact", "intro": "The web guide is free to use. These terms apply when you buy a travel guide or GPX files on pyreneestrip.com.", "s": [["Seller and contact", ["The seller is Thomas Bajer (sole trader), Sweden.", "Email: <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>. We normally reply within two working days."]], ["What you buy", ["Digital products: your own travel guides that you put together on the website, Thomas's ready-made guides and GPX files with cycling and hiking routes. The guide is delivered as a file that you open in your browser and can print or save as PDF. The GPX files work in GPS devices and map apps.", "You get a personal copy for your own use. It may not be sold or shared."]], ["Prices and payment", ["The price is shown in the checkout dialog before you pay and is the final price in the stated currency (SEK, NOK, DKK or EUR). Single purchases are paid once. Super user is a yearly subscription, see below.", "Payment is handled by Stripe. We never see your card details."]], ["Delivery", ["The file downloads as soon as the payment is complete. With the purchase link you can download it again for 30 days, also from another device. The receipt is sent to the email address you enter when paying."]], ["Super user (yearly subscription)", ["As a super user you can, during the subscription, download all your own guides, Thomas's ready-made guides and every GPX file on the site without paying per download. Anything you have downloaded is yours to keep.", "The yearly price is shown before you pay. The subscription renews automatically every year and is charged to the same payment method until you cancel. You can cancel at any time under About the guide → Super user → Manage subscription, or by writing to us. Cancellation takes effect from the next renewal and you keep access for the rest of the year.", "You log in with the personal link you receive after purchase and by email. The link is personal and must not be shared.", "The same rules on the right of withdrawal apply as for other purchases: in the checkout dialog you agree that access starts immediately."]], ["Right of withdrawal", ["For distance purchases you normally have a 14-day right of withdrawal. For digital content delivered immediately it does not apply once you have expressly agreed that delivery starts immediately and acknowledged that you thereby lose your right of withdrawal (EU Consumer Rights Directive 2011/83/EU, Art. 16(m)).", "You give this consent by ticking the box in the checkout dialog before you pay."]], ["Refunds", ["You get a full refund if the download does not work and we cannot fix it, if the file is broken or clearly differs from the description, or if you have been charged twice for the same purchase.", "Email <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a> within 30 days and attach your receipt. The money is returned to the same payment method within 14 days of us approving the refund.", "Your statutory rights in case of faulty digital content always apply."]], ["Content of the guide", ["The guide is written with care, but prices, opening hours, roads and mountain conditions change. Always check locally. Hiking, cycling, climbing and skiing are at your own risk."]], ["Booking links", ["Some links to flights, accommodation, car hire, bike rental and activities are advertising links and marked \"Ad link\". If you book through them we may earn a commission at no extra cost to you. The booking is made directly with the company concerned and their terms apply."]], ["Personal data", ["Stripe handles the payment. We receive your email address and details of the purchase and use them only for delivery, receipts and support. Purchase records are kept as long as Swedish bookkeeping law requires.", "What you do in the guide, such as My trip and your own routes, is stored only in your own browser.", "Read more in our <a href=\"/integritet/\">privacy policy</a>."]], ["Complaints and disputes", ["Contact us first and we will sort it out. If we cannot agree, you can turn to the Swedish National Board for Consumer Disputes, <a href=\"https://www.arn.se/\" rel=\"noopener\">ARN (arn.se)</a>, or get help from <a href=\"https://commission.europa.eu/live-work-travel-eu/consumer-rights-and-complaints/resolve-your-consumer-complaint/european-consumer-centres-network-ecc-net_en\" rel=\"noopener\">the European Consumer Centres Network (ECC-Net)</a>.", "Swedish law applies. This does not affect the consumer protection you have under the law of your home country."]]]}, "de": {"name": "Deutsch", "back": "← Zurück zum Reiseführer", "updated": "Zuletzt aktualisiert am 18. Oktober 2026", "title": "Kaufbedingungen, Erstattung und Kontakt", "intro": "Der Web-Reiseführer ist kostenlos. Diese Bedingungen gelten, wenn Sie auf pyreneestrip.com einen Reiseführer oder GPX-Dateien kaufen.", "s": [["Verkäufer und Kontakt", ["Verkäufer ist Thomas Bajer (Einzelunternehmen), Schweden.", "E-Mail: <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>. Wir antworten in der Regel innerhalb von zwei Werktagen."]], ["Was Sie kaufen", ["Digitale Produkte: eigene Reiseführer, die Sie auf der Website zusammenstellen, Thomas' fertige Reiseführer und GPX-Dateien mit Rad- und Wanderrouten. Der Reiseführer wird als Datei geliefert, die Sie im Browser öffnen und drucken oder als PDF speichern können. Die GPX-Dateien funktionieren auf GPS-Geräten und in Karten-Apps.", "Sie erhalten eine persönliche Kopie für den eigenen Gebrauch. Sie darf nicht verkauft oder weitergegeben werden."]], ["Preise und Zahlung", ["Der Preis wird vor der Zahlung im Kaufdialog angezeigt und ist ein Endpreis in der angegebenen Währung (SEK, NOK, DKK oder EUR). Einzelkäufe zahlen Sie einmal. Super-Nutzer ist ein Jahresabonnement, siehe unten.", "Die Zahlung wird von Stripe abgewickelt. Wir sehen Ihre Kartendaten nie."]], ["Lieferung", ["Die Datei wird heruntergeladen, sobald die Zahlung abgeschlossen ist. Mit dem Kauflink können Sie sie 30 Tage lang erneut herunterladen, auch auf einem anderen Gerät. Die Quittung wird an die E-Mail-Adresse geschickt, die Sie bei der Zahlung angeben."]], ["Super-Nutzer (Jahresabonnement)", ["Als Super-Nutzer können Sie während des Abonnements alle eigenen Reiseführer, Thomas' fertige Reiseführer und alle GPX-Dateien der Website herunterladen, ohne für jeden Download zu bezahlen. Was Sie heruntergeladen haben, dürfen Sie behalten.", "Der Jahrespreis wird vor der Zahlung angezeigt. Das Abonnement verlängert sich automatisch jedes Jahr und wird über dieselbe Zahlungsart abgerechnet, bis Sie kündigen. Sie können jederzeit unter Über den Reiseführer → Super-Nutzer → Abonnement verwalten oder per E-Mail an uns kündigen. Die Kündigung gilt ab der nächsten Verlängerung, der Zugang bleibt bis zum Ende des Jahres bestehen.", "Sie melden sich mit dem persönlichen Link an, den Sie nach dem Kauf und per E-Mail erhalten. Der Link ist persönlich und darf nicht weitergegeben werden.", "Für das Widerrufsrecht gelten dieselben Regeln wie bei anderen Käufen: Im Kaufdialog stimmen Sie zu, dass der Zugang sofort beginnt."]], ["Widerrufsrecht", ["Bei Fernabsatzkäufen haben Sie normalerweise ein Widerrufsrecht von 14 Tagen. Bei digitalen Inhalten, die sofort geliefert werden, erlischt es, wenn Sie ausdrücklich zugestimmt haben, dass die Lieferung sofort beginnt, und bestätigt haben, dass Sie dadurch Ihr Widerrufsrecht verlieren (Richtlinie 2011/83/EU, Art. 16 Buchst. m).", "Diese Zustimmung geben Sie, indem Sie vor der Zahlung das Kästchen im Kaufdialog ankreuzen."]], ["Erstattung", ["Sie erhalten den vollen Betrag zurück, wenn der Download nicht funktioniert und wir das Problem nicht lösen können, wenn die Datei fehlerhaft ist oder deutlich von der Beschreibung abweicht oder wenn Sie für denselben Kauf doppelt belastet wurden.", "Schreiben Sie innerhalb von 30 Tagen an <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a> und fügen Sie die Quittung bei. Das Geld wird innerhalb von 14 Tagen nach Genehmigung der Erstattung auf dasselbe Zahlungsmittel zurückgezahlt.", "Ihre gesetzlichen Rechte bei mangelhaften digitalen Inhalten gelten immer."]], ["Inhalt des Reiseführers", ["Der Reiseführer ist sorgfältig geschrieben, aber Preise, Öffnungszeiten, Straßen und Bedingungen in den Bergen ändern sich. Prüfen Sie immer vor Ort. Wandern, Radfahren, Klettern und Skifahren erfolgen auf eigene Gefahr."]], ["Buchungslinks", ["Einige Links zu Flügen, Unterkünften, Mietwagen, Fahrradverleih und Aktivitäten sind Werbelinks und mit \"Werbelink\" gekennzeichnet. Wenn Sie darüber buchen, erhalten wir eventuell eine Provision, ohne Mehrkosten für Sie. Die Buchung erfolgt direkt beim jeweiligen Unternehmen zu dessen Bedingungen."]], ["Personenbezogene Daten", ["Stripe wickelt die Zahlung ab. Wir erhalten Ihre E-Mail-Adresse und Angaben zum Kauf und verwenden sie nur für Lieferung, Quittung und Support. Kaufdaten werden so lange gespeichert, wie es das schwedische Buchführungsgesetz verlangt.", "Was Sie im Reiseführer anlegen, etwa Meine Reise und eigene Touren, wird nur in Ihrem eigenen Browser gespeichert.", "Mehr dazu in unserer <a href=\"/integritet/\">Datenschutzerklärung</a>."]], ["Beschwerden und Streitigkeiten", ["Kontaktieren Sie uns zuerst, dann finden wir eine Lösung. Kommt keine Einigung zustande, können Sie sich an die schwedische Verbraucherschlichtungsstelle <a href=\"https://www.arn.se/\" rel=\"noopener\">ARN (arn.se)</a> wenden oder Hilfe beim <a href=\"https://commission.europa.eu/live-work-travel-eu/consumer-rights-and-complaints/resolve-your-consumer-complaint/european-consumer-centres-network-ecc-net_en\" rel=\"noopener\">Europäischen Verbraucherzentrum (ECC-Net)</a> erhalten.", "Es gilt schwedisches Recht. Der Verbraucherschutz nach dem Recht Ihres Heimatlandes bleibt davon unberührt."]]]}, "fr": {"name": "Français", "back": "← Retour au guide", "updated": "Dernière mise à jour : 18 octobre 2026", "title": "Conditions de vente, remboursement et contact", "intro": "Le guide web est gratuit. Les présentes conditions s'appliquent lorsque vous achetez un guide de voyage ou des fichiers GPX sur pyreneestrip.com.", "s": [["Vendeur et contact", ["Le vendeur est Thomas Bajer (entreprise individuelle), Suède.", "E-mail : <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>. Nous répondons normalement sous deux jours ouvrés."]], ["Ce que vous achetez", ["Des produits numériques : vos propres guides de voyage composés sur le site, les guides prêts à l'emploi de Thomas et des fichiers GPX d'itinéraires vélo et randonnée. Le guide est livré sous forme de fichier à ouvrir dans le navigateur, que vous pouvez imprimer ou enregistrer en PDF. Les fichiers GPX fonctionnent sur les appareils GPS et les applications de cartographie.", "Vous recevez une copie personnelle pour votre usage privé. Elle ne peut être ni revendue ni diffusée."]], ["Prix et paiement", ["Le prix est affiché dans la fenêtre d'achat avant le paiement et constitue le prix final dans la devise indiquée (SEK, NOK, DKK ou EUR). Les achats à l'unité se paient une seule fois. Le statut de super-utilisateur est un abonnement annuel, voir ci-dessous.", "Le paiement est géré par Stripe. Nous ne voyons jamais vos données de carte."]], ["Livraison", ["Le fichier se télécharge dès que le paiement est validé. Grâce au lien d'achat, vous pouvez le télécharger à nouveau pendant 30 jours, y compris depuis un autre appareil. Le reçu est envoyé à l'adresse e-mail indiquée lors du paiement."]], ["Super-utilisateur (abonnement annuel)", ["En tant que super-utilisateur, vous pouvez pendant la durée de l'abonnement télécharger tous vos guides personnalisés, les guides tout prêts de Thomas et tous les fichiers GPX du site sans payer chaque téléchargement. Ce que vous avez téléchargé vous reste acquis.", "Le prix annuel est affiché avant le paiement. L'abonnement se renouvelle automatiquement chaque année et est prélevé sur le même moyen de paiement jusqu'à sa résiliation. Vous pouvez résilier à tout moment sous À propos du guide → Super-utilisateur → Gérer l'abonnement, ou en nous écrivant. La résiliation prend effet au prochain renouvellement et vous gardez l'accès jusqu'à la fin de l'année.", "Vous vous connectez avec le lien personnel reçu après l'achat et par e-mail. Ce lien est personnel et ne doit pas être partagé.", "Les mêmes règles de droit de rétractation s'appliquent qu'aux autres achats : dans la fenêtre d'achat, vous acceptez que l'accès commence immédiatement."]], ["Droit de rétractation", ["Pour un achat à distance, vous disposez normalement d'un droit de rétractation de 14 jours. Pour un contenu numérique fourni immédiatement, ce droit ne s'applique pas dès lors que vous avez expressément accepté que la livraison commence immédiatement et reconnu renoncer ainsi à votre droit de rétractation (directive 2011/83/UE, art. 16, point m).", "Vous donnez ce consentement en cochant la case de la fenêtre d'achat avant de payer."]], ["Remboursement", ["Vous êtes intégralement remboursé si le téléchargement ne fonctionne pas et que nous ne parvenons pas à résoudre le problème, si le fichier est défectueux ou nettement différent de sa description, ou si vous avez été débité deux fois pour le même achat.", "Écrivez à <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a> dans les 30 jours en joignant votre reçu. Le remboursement est effectué sur le même moyen de paiement dans les 14 jours suivant notre accord.", "Vos droits légaux en cas de contenu numérique défectueux s'appliquent toujours."]], ["Contenu du guide", ["Le guide est rédigé avec soin, mais les prix, horaires, routes et conditions en montagne évoluent. Vérifiez toujours sur place. La randonnée, le vélo, l'escalade et le ski se pratiquent à vos propres risques."]], ["Liens de réservation", ["Certains liens vers des vols, hébergements, locations de voiture ou de vélo et activités sont des liens publicitaires, signalés par la mention « Lien publicitaire ». Si vous réservez par leur intermédiaire, nous pouvons percevoir une commission, sans surcoût pour vous. La réservation est conclue directement avec l'entreprise concernée, selon ses conditions."]], ["Données personnelles", ["Stripe gère le paiement. Nous recevons votre adresse e-mail et les informations sur l'achat et ne les utilisons que pour la livraison, le reçu et l'assistance. Les données d'achat sont conservées aussi longtemps que l'exige la loi comptable suédoise.", "Ce que vous faites dans le guide, comme Mon voyage et vos propres itinéraires, est enregistré uniquement dans votre navigateur.", "En savoir plus dans notre <a href=\"/integritet/\">politique de confidentialité</a>."]], ["Réclamations et litiges", ["Contactez-nous d'abord, nous trouverons une solution. À défaut d'accord, vous pouvez saisir la commission suédoise des litiges de consommation, <a href=\"https://www.arn.se/\" rel=\"noopener\">ARN (arn.se)</a>, ou obtenir de l'aide auprès du <a href=\"https://commission.europa.eu/live-work-travel-eu/consumer-rights-and-complaints/resolve-your-consumer-complaint/european-consumer-centres-network-ecc-net_en\" rel=\"noopener\">Centre Européen des Consommateurs (réseau ECC-Net)</a>.", "Le droit suédois s'applique, sans préjudice de la protection dont vous bénéficiez en vertu du droit de votre pays de résidence."]]]}, "es": {"name": "Español", "back": "← Volver a la guía", "updated": "Última actualización: 18 de octubre de 2026", "title": "Condiciones de compra, reembolsos y contacto", "intro": "La guía web es gratuita. Estas condiciones se aplican cuando compras una guía de viaje o archivos GPX en pyreneestrip.com.", "s": [["Vendedor y contacto", ["El vendedor es Thomas Bajer (empresario individual), Suecia.", "Correo electrónico: <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>. Normalmente respondemos en un plazo de dos días laborables."]], ["Qué compras", ["Productos digitales: guías de viaje propias que montas en la web, las guías ya preparadas de Thomas y archivos GPX con rutas en bici y a pie. La guía se entrega como un archivo que abres en el navegador y puedes imprimir o guardar como PDF. Los archivos GPX funcionan en dispositivos GPS y apps de mapas.", "Recibes una copia personal para uso propio. No puede venderse ni difundirse."]], ["Precios y pago", ["El precio se muestra en la ventana de compra antes de pagar y es el precio final en la moneda indicada (SEK, NOK, DKK o EUR). Las compras sueltas se pagan una vez. Superusuario es una suscripción anual, ver más abajo.", "El pago lo gestiona Stripe. Nunca vemos los datos de tu tarjeta."]], ["Entrega", ["El archivo se descarga en cuanto se completa el pago. Con el enlace de compra puedes volver a descargarlo durante 30 días, también desde otro dispositivo. El recibo se envía al correo electrónico que indiques al pagar."]], ["Superusuario (suscripción anual)", ["Como superusuario puedes, mientras dure la suscripción, descargar todas tus guías propias, las guías listas de Thomas y todos los archivos GPX del sitio sin pagar por cada descarga. Lo que hayas descargado es tuyo.", "El precio anual se muestra antes de pagar. La suscripción se renueva automáticamente cada año y se cobra en el mismo medio de pago hasta que la canceles. Puedes cancelarla en cualquier momento en Sobre la guía → Superusuario → Gestionar suscripción, o escribiéndonos. La cancelación surte efecto en la próxima renovación y mantienes el acceso hasta el final del año.", "Accedes con el enlace personal que recibes tras la compra y por correo electrónico. El enlace es personal y no debe compartirse.", "Se aplican las mismas normas sobre el derecho de desistimiento que en otras compras: en la ventana de compra aceptas que el acceso empiece de inmediato."]], ["Derecho de desistimiento", ["En las compras a distancia tienes normalmente 14 días para desistir. En el contenido digital que se entrega de inmediato no se aplica cuando has dado tu consentimiento expreso para que la entrega empiece de inmediato y has reconocido que con ello pierdes el derecho de desistimiento (Directiva 2011/83/UE, art. 16, letra m).", "Das este consentimiento marcando la casilla de la ventana de compra antes de pagar."]], ["Reembolsos", ["Te devolvemos el importe íntegro si la descarga no funciona y no podemos solucionarlo, si el archivo está dañado o difiere claramente de la descripción, o si se te ha cobrado dos veces la misma compra.", "Escribe a <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a> en un plazo de 30 días y adjunta el recibo. El dinero se devuelve al mismo medio de pago en un plazo de 14 días desde que aprobemos el reembolso.", "Tus derechos legales en caso de contenido digital defectuoso se aplican siempre."]], ["Contenido de la guía", ["La guía está escrita con cuidado, pero los precios, horarios, carreteras y condiciones en la montaña cambian. Compruébalo siempre en el lugar. El senderismo, el ciclismo, la escalada y el esquí se practican bajo tu propia responsabilidad."]], ["Enlaces de reserva", ["Algunos enlaces a vuelos, alojamiento, alquiler de coches y bicicletas y actividades son enlaces publicitarios y llevan la etiqueta «Enlace publicitario». Si reservas a través de ellos, podemos recibir una comisión sin coste adicional para ti. La reserva se hace directamente con la empresa correspondiente y se rige por sus condiciones."]], ["Datos personales", ["Stripe gestiona el pago. Recibimos tu correo electrónico y los datos de la compra y solo los usamos para la entrega, el recibo y la atención al cliente. Los datos de compra se conservan durante el tiempo que exige la ley contable sueca.", "Lo que haces en la guía, como Mi viaje y tus propias rutas, se guarda solo en tu navegador.", "Más información en nuestra <a href=\"/integritet/\">política de privacidad</a>."]], ["Reclamaciones y litigios", ["Ponte en contacto con nosotros primero y lo resolveremos. Si no llegamos a un acuerdo, puedes acudir a la Junta Nacional Sueca de Reclamaciones de Consumo, <a href=\"https://www.arn.se/\" rel=\"noopener\">ARN (arn.se)</a>, o pedir ayuda al <a href=\"https://commission.europa.eu/live-work-travel-eu/consumer-rights-and-complaints/resolve-your-consumer-complaint/european-consumer-centres-network-ecc-net_en\" rel=\"noopener\">Centro Europeo del Consumidor (red ECC-Net)</a>.", "Se aplica la ley sueca, sin perjuicio de la protección al consumidor que te otorga la ley de tu país de residencia."]]]}, "it": {"name": "Italiano", "back": "← Torna alla guida", "updated": "Ultimo aggiornamento: 18 ottobre 2026", "title": "Condizioni di acquisto, rimborsi e contatti", "intro": "La guida web è gratuita. Queste condizioni si applicano quando acquisti una guida di viaggio o file GPX su pyreneestrip.com.", "s": [["Venditore e contatti", ["Il venditore è Thomas Bajer (ditta individuale), Svezia.", "E-mail: <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>. Di norma rispondiamo entro due giorni lavorativi."]], ["Cosa acquisti", ["Prodotti digitali: guide di viaggio personalizzate che componi sul sito, le guide già pronte di Thomas e file GPX con percorsi in bici ed escursionistici. La guida viene consegnata come file da aprire nel browser, che puoi stampare o salvare in PDF. I file GPX funzionano su dispositivi GPS e app di mappe.", "Ricevi una copia personale per uso privato. Non può essere rivenduta né diffusa."]], ["Prezzi e pagamento", ["Il prezzo è indicato nella finestra di acquisto prima del pagamento ed è il prezzo finale nella valuta indicata (SEK, NOK, DKK o EUR). Gli acquisti singoli si pagano una volta. Super utente è un abbonamento annuale, vedi sotto.", "Il pagamento è gestito da Stripe. Non vediamo mai i dati della tua carta."]], ["Consegna", ["Il file si scarica non appena il pagamento è completato. Con il link di acquisto puoi scaricarlo di nuovo per 30 giorni, anche da un altro dispositivo. La ricevuta viene inviata all'indirizzo e-mail che indichi al momento del pagamento."]], ["Super utente (abbonamento annuale)", ["Come super utente puoi, per la durata dell'abbonamento, scaricare tutte le tue guide, le guide pronte di Thomas e tutti i file GPX del sito senza pagare ogni download. Ciò che hai scaricato resta tuo.", "Il prezzo annuale è indicato prima del pagamento. L'abbonamento si rinnova automaticamente ogni anno e viene addebitato sullo stesso metodo di pagamento finché non lo disdici. Puoi disdirlo in qualsiasi momento in Informazioni sulla guida → Super utente → Gestisci abbonamento, oppure scrivendoci. La disdetta vale dal rinnovo successivo e mantieni l'accesso fino alla fine dell'anno.", "Accedi con il link personale che ricevi dopo l'acquisto e via e-mail. Il link è personale e non va condiviso.", "Valgono le stesse regole sul diritto di recesso degli altri acquisti: nella finestra di acquisto acconsenti a che l'accesso inizi subito."]], ["Diritto di recesso", ["Per gli acquisti a distanza hai normalmente 14 giorni per recedere. Per i contenuti digitali forniti immediatamente il diritto non si applica se hai espressamente acconsentito all'avvio immediato della fornitura e riconosciuto di perdere così il diritto di recesso (direttiva 2011/83/UE, art. 16, lett. m).", "Dai questo consenso spuntando la casella nella finestra di acquisto prima di pagare."]], ["Rimborsi", ["Ricevi il rimborso completo se il download non funziona e non riusciamo a risolvere il problema, se il file è danneggiato o diverso in modo evidente dalla descrizione, oppure se ti è stato addebitato due volte lo stesso acquisto.", "Scrivi a <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a> entro 30 giorni allegando la ricevuta. L'importo viene restituito sullo stesso metodo di pagamento entro 14 giorni dall'approvazione del rimborso.", "I tuoi diritti di legge in caso di contenuti digitali difettosi si applicano sempre."]], ["Contenuto della guida", ["La guida è scritta con cura, ma prezzi, orari, strade e condizioni in montagna cambiano. Verifica sempre sul posto. Escursionismo, ciclismo, arrampicata e sci si praticano a proprio rischio."]], ["Link di prenotazione", ["Alcuni link a voli, alloggi, noleggio auto e bici e attività sono link pubblicitari e sono contrassegnati con «Link pubblicitario». Se prenoti tramite essi possiamo ricevere una commissione, senza costi aggiuntivi per te. La prenotazione avviene direttamente con l'azienda interessata, alle sue condizioni."]], ["Dati personali", ["Stripe gestisce il pagamento. Riceviamo il tuo indirizzo e-mail e i dati dell'acquisto e li usiamo solo per consegna, ricevuta e assistenza. I dati di acquisto sono conservati per il tempo richiesto dalla legge contabile svedese.", "Ciò che fai nella guida, come Il mio viaggio e i tuoi percorsi, viene salvato solo nel tuo browser.", "Maggiori informazioni nella nostra <a href=\"/integritet/\">informativa sulla privacy</a>."]], ["Reclami e controversie", ["Contattaci prima e troveremo una soluzione. Se non raggiungiamo un accordo, puoi rivolgerti alla commissione svedese per le controversie dei consumatori, <a href=\"https://www.arn.se/\" rel=\"noopener\">ARN (arn.se)</a>, o chiedere aiuto al <a href=\"https://commission.europa.eu/live-work-travel-eu/consumer-rights-and-complaints/resolve-your-consumer-complaint/european-consumer-centres-network-ecc-net_en\" rel=\"noopener\">Centro Europeo Consumatori (rete ECC-Net)</a>.", "Si applica la legge svedese, fatta salva la tutela del consumatore prevista dalla legge del tuo paese di residenza."]]]}, "pt": {"name": "Português", "back": "← Voltar ao guia", "updated": "Última atualização: 18 de outubro de 2026", "title": "Condições de compra, reembolsos e contacto", "intro": "O guia web é gratuito. Estas condições aplicam-se quando compra um guia de viagem ou ficheiros GPX em pyreneestrip.com.", "s": [["Vendedor e contacto", ["O vendedor é Thomas Bajer (empresário em nome individual), Suécia.", "E-mail: <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a>. Normalmente respondemos no prazo de dois dias úteis."]], ["O que compra", ["Produtos digitais: guias de viagem próprios que monta no site, os guias prontos do Thomas e ficheiros GPX com percursos de bicicleta e a pé. O guia é entregue como um ficheiro que abre no navegador e pode imprimir ou guardar em PDF. Os ficheiros GPX funcionam em aparelhos GPS e aplicações de mapas.", "Recebe uma cópia pessoal para uso próprio. Não pode ser vendida nem partilhada."]], ["Preços e pagamento", ["O preço é apresentado na janela de compra antes do pagamento e é o preço final na moeda indicada (SEK, NOK, DKK ou EUR). As compras avulsas pagam-se uma vez. Superutilizador é uma assinatura anual, ver abaixo.", "O pagamento é processado pela Stripe. Nunca vemos os dados do seu cartão."]], ["Entrega", ["O ficheiro é descarregado assim que o pagamento é concluído. Com a ligação de compra pode descarregá-lo novamente durante 30 dias, também noutro dispositivo. O recibo é enviado para o e-mail que indicar no pagamento."]], ["Superutilizador (assinatura anual)", ["Como superutilizador pode, durante a assinatura, descarregar todos os seus guias, os guias prontos do Thomas e todos os ficheiros GPX do site sem pagar cada descarga. O que descarregou fica consigo.", "O preço anual é apresentado antes do pagamento. A assinatura renova-se automaticamente todos os anos e é cobrada no mesmo meio de pagamento até a cancelar. Pode cancelá-la a qualquer momento em Sobre o guia → Superutilizador → Gerir assinatura, ou escrevendo-nos. O cancelamento produz efeito na renovação seguinte e mantém o acesso até ao fim do ano.", "Entra com a ligação pessoal que recebe após a compra e por e-mail. A ligação é pessoal e não deve ser partilhada.", "Aplicam-se as mesmas regras sobre o direito de livre resolução que nas outras compras: na janela de compra aceita que o acesso comece de imediato."]], ["Direito de livre resolução", ["Nas compras à distância tem normalmente 14 dias para desistir. Para conteúdos digitais fornecidos de imediato, esse direito não se aplica quando deu o seu consentimento expresso para que a entrega comece de imediato e reconheceu que perde assim o direito de livre resolução (Diretiva 2011/83/UE, art. 16.º, alínea m).", "Dá este consentimento ao assinalar a caixa na janela de compra antes de pagar."]], ["Reembolsos", ["Recebe o valor total de volta se o download não funcionar e não conseguirmos resolver, se o ficheiro estiver danificado ou for claramente diferente da descrição, ou se lhe tiverem cobrado duas vezes a mesma compra.", "Escreva para <a href=\"mailto:info@pyreneestrip.com\">info@pyreneestrip.com</a> no prazo de 30 dias e anexe o recibo. O dinheiro é devolvido pelo mesmo meio de pagamento no prazo de 14 dias após aprovarmos o reembolso.", "Os seus direitos legais em caso de conteúdo digital defeituoso aplicam-se sempre."]], ["Conteúdo do guia", ["O guia foi escrito com cuidado, mas preços, horários, estradas e condições na montanha mudam. Confirme sempre no local. Caminhadas, ciclismo, escalada e esqui são praticados por sua conta e risco."]], ["Ligações de reserva", ["Algumas ligações para voos, alojamento, aluguer de automóveis e bicicletas e atividades são ligações publicitárias e estão assinaladas com «Ligação publicitária». Se reservar através delas, podemos receber uma comissão, sem custo adicional para si. A reserva é feita diretamente com a empresa em causa, segundo as condições desta."]], ["Dados pessoais", ["A Stripe processa o pagamento. Recebemos o seu e-mail e os dados da compra e usamo-los apenas para entrega, recibo e apoio. Os dados de compra são conservados durante o tempo exigido pela lei contabilística sueca.", "O que faz no guia, como A minha viagem e os seus percursos, fica guardado apenas no seu navegador.", "Saiba mais na nossa <a href=\"/integritet/\">política de privacidade</a>."]], ["Reclamações e litígios", ["Contacte-nos primeiro e resolveremos a questão. Se não chegarmos a acordo, pode recorrer à comissão sueca de litígios de consumo, <a href=\"https://www.arn.se/\" rel=\"noopener\">ARN (arn.se)</a>, ou pedir ajuda ao <a href=\"https://commission.europa.eu/live-work-travel-eu/consumer-rights-and-complaints/resolve-your-consumer-complaint/european-consumer-centres-network-ecc-net_en\" rel=\"noopener\">Centro Europeu do Consumidor (rede ECC-Net)</a>.", "Aplica-se a lei sueca, sem prejuízo da proteção do consumidor que lhe confere a lei do seu país de residência."]]]}};
